services:
  - type: web
    name: chat-app-backend
    runtime: node
    rootDir: back-end
    buildCommand: npm ci && npm run build
    startCommand: npm run prod
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONT_END_BASE_URL
        sync: false
      - key: SOCKET_CORS_ORIGINS
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
