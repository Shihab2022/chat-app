databases:
  - name: postgres-db
    databaseName: chat_db
    user: postgres

services:
  # 1. Internal Backend Service
  - type: pserv
    name: backend
    runtime: docker
    dockerfilePath: .docker/backend.Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: postgres-db
          property: connectionString

  # 2. Internal Frontend Service
  - type: pserv
    name: frontend
    runtime: docker
    dockerfilePath: .docker/frontend.Dockerfile
    dockerContext: .

  # 3. Public API Gateway / Load Balancer
  - type: web
    name: load-balancer
    runtime: docker
    dockerfilePath: .docker/loadbalancer.Dockerfile
    dockerContext: .
    envVars:
      - key: PORT
        value: 80
